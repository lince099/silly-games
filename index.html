<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>silly games</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --ink: #1a1610;
    --warm: #b85c2a;
    --muted: #7a6e62;
    --blush: #e8d5c4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1rem;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 10vw, 6rem);
    font-style: italic;
    color: var(--warm);
    line-height: 1;
    margin-bottom: 0.5rem;
  }
  .sub {
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 3rem;
    text-transform: uppercase;
  }
  .games {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  a.game-card {
    display: block;
    border: 2px solid var(--ink);
    padding: 1.5rem;
    background: white;
    text-decoration: none;
    color: var(--ink);
    transition: all 0.15s;
    position: relative;
  }
  a.game-card:hover {
    background: var(--ink);
    color: var(--cream);
  }
  a.game-card:hover .game-desc { color: var(--blush); }
  .game-tag {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: var(--warm);
    color: white;
    padding: 0.15rem 0.5rem;
    margin-bottom: 0.5rem;
    display: inline-block;
  }
  .game-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    margin-bottom: 0.4rem;
  }
  .game-desc { font-size: 0.8rem; color: var(--muted); }
  .arrow {
    position: absolute;
    right: 1.5rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.5rem;
    opacity: 0.3;
  }
</style>
</head>
<body>
  <h1>silly games</h1>
  <p class="sub">for two people & a link</p>

  <div class="games">
    <a href="./blind-reply/" class="game-card">
      <div class="game-tag">2 players</div>
      <div class="game-name">Blind Reply</div>
      <p class="game-desc">Answer the same questions without seeing each other's replies. Share via WhatsApp, reveal together.</p>
      <span class="arrow">→</span>
    </a>
    <!-- more games can go here -->
  </div>
</body>
</html>
